.r{opacity:0;animation-duration:14s;animation-iteration-count:infinite}@keyframes h0{0%,4.0%{opacity:0}6.5%,93%{opacity:1}98%,100%{opacity:0}}@keyframes h1{0%,14.0%{opacity:0}16.5%,93%{opacity:1}98%,100%{opacity:0}}@keyframes h2{0%,24.0%{opacity:0}26.5%,93%{opacity:1}98%,100%{opacity:0}}@keyframes h3{0%,34.0%{opacity:0}36.5%,93%{opacity:1}98%,100%{opacity:0}}@keyframes h4{0%,44.0%{opacity:0}46.5%,93%{opacity:1}98%,100%{opacity:0}}@keyframes h5{0%,54.0%{opacity:0}56.5%,93%{opacity:1}98%,100%{opacity:0}}@keyframes h6{0%,64.0%{opacity:0}66.5%,93%{opacity:1}98%,100%{opacity:0}}@keyframes hstar{0%,67.0%{opacity:0}69.5%,93%{opacity:1}98%,100%{opacity:0}}</style><rect class="bg" width="1000" height="280" rx="14"/><text x="40" y="62" class="ink" font-size="30" font-weight="700">One Markdown file.</text><text x="40" y="100" class="teal" font-size="30" font-weight="700">228 experiments.</text><text x="40" y="136" class="mut" font-size="16">How I run ML experiments with a coding agent:</text><text x="40" y="160" class="mut" font-size="16">one change at a time, every result written down.</text><rect x="40" y="186" width="140" height="30" rx="15" class="blueBg"/><text x="110" y="206" text-anchor="middle" class="blue" font-size="13" font-weight="600">5 projects</text><rect x="190" y="186" width="140" height="30" rx="15" class="amberBg"/><text x="260" y="206" text-anchor="middle" class="amber" font-size="13" font-weight="600">6 GB laptop GPU</text><rect x="340" y="186" width="140" height="30" rx="15" class="greenBg"/><text x="410" y="206" text-anchor="middle" class="green" font-size="13" font-weight="600">0 guessed numbers</text><rect x="510" y="30" width="460" height="253" rx="10" class="card"/><circle cx="528" cy="48" r="5" class="red"/><circle cx="544" cy="48" r="5" class="amber"/><circle cx="560" cy="48" r="5" class="green"/><text x="580" y="52" class="mut mono" font-size="12">journal.tsv  (DeepSeek-OCR, real rows)</text><text x="524" y="78" class="mut mono" font-size="11">id   parent stage    status  s/page  what changed</text><g class="r" style="animation-name:h0"><text x="524" y="102" class="ink mono" font-size="12">000        draft    good    98.25  baseline, GPU 2% busy</text></g><g class="r" style="animation-name:h1"><text x="524" y="129" class="ink mono" font-size="12">002   000  improve  good    81.40  remove sync stalls</text></g><g class="r" style="animation-name:h2"><text x="524" y="156" class="red mono" font-size="12">010   002  improve  buggy   65.31  failed quality gate</text></g><g class="r" style="animation-name:h3"><text x="524" y="183" class="ink mono" font-size="12">022   020  improve  good    41.97  int8 experts</text></g><g class="r" style="animation-name:h4"><text x="524" y="210" class="ink mono" font-size="12">024   022  improve  good    34.16  CUDA graph</text></g><g class="r" style="animation-name:h5"><text x="524" y="237" class="ink mono" font-size="12">031   024  improve  good    18.01  fused Triton kernel</text></g><g class="r" style="animation-name:h6"><text x="524" y="264" class="amber mono" font-size="12">036   031  improve  good    11.90  8.26x, same output</text></g><g class="r" style="animation-name:hstar"><text x="946" y="264" class="amber" font-size="16">★</text></g></svg>